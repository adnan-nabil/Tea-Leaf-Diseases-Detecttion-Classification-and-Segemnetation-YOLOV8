<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea Leaf Disease Detector</title>
    <!-- Tailwind CSS CDN for swift, responsive UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

    <!-- Header Section -->
    <header class="bg-emerald-700 text-white shadow-md py-6 px-4 mb-8">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Tea Leaf Disease Detector</h1>
                <p class="text-emerald-100 text-sm mt-1">Instance Segmentation Project (YOLOv8 + FastAPI)</p>
            </div>
            
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 pb-16">
        
        <!-- Upload Card & Controls -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">1. Upload affected Leaf Image (test set available in github)</h2>
            
            <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-lg p-8 bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer relative" id="drop-zone">
                <input type="file" id="file-input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                <svg class="w-12 h-12 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="text-sm text-gray-600 text-center"><span class="font-medium text-emerald-600">Click to upload</span> or drag and drop</p>
                <p class="text-xs text-gray-400 mt-1">Supports PNG, JPG, or JPEG</p>
            </div>

            <div class="mt-4 flex justify-center">
                <button id="predict-btn" disabled class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                    <span>Run Disease Detection</span>
                    <!-- Loading Spinner -->
                    <svg id="spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
        </section>

        <!-- Dynamic Results Visualizer Panel -->
        <section id="results-section" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
            <!-- Left: Original Visual Area -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Original Image</h3>
                <div class="bg-gray-900 rounded-lg overflow-hidden flex items-center justify-center min-h-[300px] max-h-[500px]">
                    <img id="src-preview" class="object-contain w-full h-full" alt="Original Upload">
                </div>
            </div>

            <!-- Right: Inference Output Mask Visual Area -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">YOLOv8 Instance Segmentation Output</h3>
                <div class="bg-gray-900 rounded-lg overflow-hidden flex items-center justify-center min-h-[300px] max-h-[500px]">
                    <img id="res-preview" class="object-contain w-full h-full" alt="Segmentation Output">
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Logic Handling Interaction & API Communication -->
    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const predictBtn = document.getElementById('predict-btn');
        const spinner = document.getElementById('spinner');
        const resultsSection = document.getElementById('results-section');
        const srcPreview = document.getElementById('src-preview');
        const resPreview = document.getElementById('res-preview');
        let selectedFile = null;
        // Visual Drag & Drop Highlight triggers
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('bg-emerald-50', 'border-emerald-400');
            }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('bg-emerald-50', 'border-emerald-400');
            }, false);
        });
        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                handleFileSelection(files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelection(e.target.files[0]);
            }
        });
        function handleFileSelection(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file only.');
                return;
            }
            selectedFile = file;
            predictBtn.disabled = false;
            
            // Read and showcase local original image preview immediately
            const reader = new FileReader();
            reader.onload = function(e) {
                srcPreview.src = e.target.result;
                resultsSection.classList.remove('hidden');
                // Temporarily hide old segmentation output if new image is loaded
                resPreview.src = '';
            }
            reader.readAsDataURL(file);
        }
        predictBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            // Trigger loading styling states
            predictBtn.disabled = true;
            spinner.classList.remove('hidden');
            const formData = new FormData();
            formData.append('file', selectedFile);
            try {
                const response = await fetch('https://n25-bd-yolov8-tea.hf.space/predict', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Inference execution failed.');
                }
                const data = await response.json();
                
                if (data.success) {
                    // Update segment image target only
                    resPreview.src = data.image;
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
                console.error(error);
            } finally {
                // Revert button interface state out of loading configuration
                predictBtn.disabled = false;
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
